<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem("vibelyTheme");if(t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";}catch(e){}</script>
  <title>Vibely – Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="profile">
  <script>try{if(!sessionStorage.getItem("vibelyUser")){window.addEventListener("pagereveal",e=>{try{if(e.viewTransition)e.viewTransition.skipTransition();}catch(_){}});location.replace("login.html");}}catch(e){}</script>
  <header class="topbar">
    <span class="logo">vibely</span>
    <button type="button" class="nav-toggle" id="navToggle" aria-haspopup="true" aria-expanded="false" aria-controls="topbarNav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="topbarNav">
      <a href="dashboard.html">Home</a>
      <a href="events.html">Events</a>
      <a href="groups.html">Groups</a>
      <a href="music.html">Music</a>
      <a href="lostfound.html">Lost &amp; Found</a>
      <a href="rides.html">Rides</a>
      <a href="profile.html" class="active">Profile</a>
    </nav>
    <a href="messages.html" class="notif-btn" id="msgLink" aria-label="Messages">
      <span aria-hidden="true">&#9993;</span><span id="msgBadge" class="notif-badge" hidden>0</span>
    </a>
    <a href="notifications.html" class="notif-btn" id="notifLink" aria-label="Notifications">
      <span aria-hidden="true">&#128276;</span><span id="notifBadge" class="notif-badge" hidden>0</span>
    </a>
    <button id="logout" class="link">Log out</button>
  </header>

  <div class="search-bar">
    <div class="search-wrap">
      <input type="search" id="globalSearch" placeholder="Search Vibely" aria-label="Search people, events, groups, lost and found, rides" autocomplete="off">
      <div class="search-results" id="searchResults" hidden></div>
    </div>
  </div>

  <main class="home profile">
    <div id="userView">
      <div id="uAvatar"></div>
      <h2 id="uName"></h2>
      <p id="uWho" class="sub"></p>

      <section class="card form-card">
        <div class="post-actions">
          <a class="btn-small" href="settings.html">Edit profile</a>
        </div>

        <p class="sub" style="margin-top:1rem;"><span id="followerCount">0</span> followers &middot; <span id="followingCount">0</span> following</p>
        <div class="post-actions">
          <button type="button" class="post-btn" data-action="toggle-followers">Followers</button>
          <button type="button" class="post-btn" data-action="toggle-following">Following</button>
        </div>
        <div class="group-members" id="followersBox" hidden><div class="member-list" id="followersList"></div></div>
        <div class="group-members" id="followingBox" hidden><div class="member-list" id="followingList"></div></div>
      </section>

      <section class="card form-card">
        <h3>About</h3>
        <p id="uDetailLine" class="sub"></p>
        <p id="uBio"></p>
        <p id="uCourse" class="sub"></p>
        <p id="uInterests" class="sub"></p>
        <p id="emptyHint" class="notice" hidden>Your profile is missing a few details. <a href="settings.html">Complete it in settings</a> so people can find you.</p>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
