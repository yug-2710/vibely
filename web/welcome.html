<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem("vibelyTheme");if(t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";}catch(e){}</script>
  <title>Vibely – Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="welcome">
  <script>try{if(!sessionStorage.getItem("vibelyUser")){window.addEventListener("pagereveal",e=>{try{if(e.viewTransition)e.viewTransition.skipTransition();}catch(_){}});location.replace("login.html");}}catch(e){}</script>
  <header class="topbar topbar-simple">
    <span class="logo">vibely</span>
    <button id="logout" class="link">Log out</button>
  </header>

  <main class="home welcome-page">
    <h2 id="welcomeTitle">Welcome to Vibely!</h2>
    <p class="sub">Follow a few people and join a group or two, so your feed has something in it from the start.</p>

    <section class="card form-card" id="courseCard" hidden style="margin-top:1.5rem;">
      <h3>Find your classmates</h3>
      <p class="sub">Add your course and we'll show people from it first.</p>
      <form id="courseForm" novalidate autocomplete="off">
        <div class="course-row">
          <div>
            <label for="wCourse">Course / branch</label>
            <input id="wCourse" type="text" maxlength="60" placeholder="e.g. B.Tech Computer Science" list="courseList">
            <datalist id="courseList"></datalist>
          </div>
          <div>
            <label for="wYear">Year</label>
            <select id="wYear">
              <option value="">Select year</option>
              <option>1st year</option><option>2nd year</option><option>3rd year</option>
              <option>4th year</option><option>Postgraduate</option><option>Other</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn">Save</button>
      </form>
    </section>

    <h3 class="section-title">People to follow</h3>
    <div id="people"></div>

    <h3 class="section-title">Groups to join</h3>
    <div id="groupPicks" class="group-pick-grid"></div>
  </main>

  <div class="onboard-bar">
    <span id="progress"></span>
    <button type="button" class="btn-small" id="finishBtn">Skip for now</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
