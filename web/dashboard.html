<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem("vibelyTheme");if(t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";}catch(e){}</script>
  <title>Vibely – Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
  <script>try{if(!sessionStorage.getItem("vibelyUser")){window.addEventListener("pagereveal",e=>{try{if(e.viewTransition)e.viewTransition.skipTransition();}catch(_){}});location.replace("login.html");}}catch(e){}</script>
  <header class="topbar">
    <span class="logo">vibely</span>
    <button type="button" class="nav-toggle" id="navToggle" aria-haspopup="true" aria-expanded="false" aria-controls="topbarNav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="topbarNav">
      <a href="dashboard.html" class="active">Home</a>
      <a href="events.html">Events</a>
      <a href="groups.html">Groups</a>
      <a href="music.html">Music</a>
      <a href="lostfound.html">Lost &amp; Found</a>
      <a href="rides.html">Rides</a>
      <a href="profile.html">Profile</a>
    </nav>
    <a href="messages.html" class="notif-btn" id="msgLink" aria-label="Messages">
      <span aria-hidden="true">&#9993;</span><span id="msgBadge" class="notif-badge" hidden>0</span>
    </a>
    <a href="notifications.html" class="notif-btn" id="notifLink" aria-label="Notifications">
      <span aria-hidden="true">&#128276;</span><span id="notifBadge" class="notif-badge" hidden>0</span>
    </a>
    <button id="logout" class="link">Log out</button>
  </header>

  <div class="search-bar">
    <div class="search-wrap">
      <input type="search" id="globalSearch" placeholder="Search Vibely" aria-label="Search people, events, groups, lost and found, rides" autocomplete="off">
      <div class="search-results" id="searchResults" hidden></div>
    </div>
  </div>

  <main class="home">
    <h2 id="welcome"></h2>
    <p id="detail" class="sub"></p>

    <section class="card meter">
      <h3>Your profile is <span id="pct">0</span>% complete</h3>
      <div class="bar"><div id="barFill"></div></div>
      <p id="meterHint"></p>
      <a href="settings.html" class="btn-small">Edit profile</a>
    </section>

    <section class="feed-block" id="mainFeed">
      <form class="post-composer composer-card" autocomplete="off">
        <div class="composer-head">
          <span id="composerAvatar" aria-hidden="true"></span>
          <textarea rows="2" maxlength="1000" placeholder="What&rsquo;s on your mind?" aria-label="Share something with campus" required></textarea>
        </div>
        <div class="composer-photo" hidden>
          <img class="composer-photo-preview" alt="">
          <button type="button" class="composer-photo-remove" aria-label="Remove photo">&times;</button>
        </div>
        <div class="composer-actions">
          <label class="composer-photo-btn" title="Add a photo">
            <input type="file" accept="image/*" hidden>
            <span aria-hidden="true">&#128247;</span>
          </label>
          <span class="char-hint">Up to 1000 characters</span>
          <button type="submit" class="btn-small">Post</button>
        </div>
      </form>
      <div class="feed-list"></div>
    </section>

    <h3 class="section-title">For you</h3>
    <div id="cards"></div>

    <h3 class="section-title">Discover people <a class="see-all" href="discover.html">Find more people &rarr;</a></h3>
    <div id="people"></div>

    <h3 class="section-title">Upcoming on campus <a class="see-all" href="events.html">See all &rarr;</a></h3>
    <ul id="events" class="events"></ul>

    <h3 class="section-title">Quick links</h3>
    <nav class="shortcuts" aria-label="Quick links">
      <a class="shortcut" href="events.html"><span aria-hidden="true">&#127881;</span>Events</a>
      <a class="shortcut" href="rides.html"><span aria-hidden="true">&#128663;</span>Rides</a>
      <a class="shortcut" href="lostfound.html"><span aria-hidden="true">&#128269;</span>Lost &amp; Found</a>
      <a class="shortcut" href="music.html"><span aria-hidden="true">&#127925;</span>Music</a>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
