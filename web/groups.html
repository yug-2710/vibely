<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem("vibelyTheme");if(t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";}catch(e){}</script>
  <title>Vibely – Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="groups">
  <script>try{if(!sessionStorage.getItem("vibelyUser")){window.addEventListener("pagereveal",e=>{try{if(e.viewTransition)e.viewTransition.skipTransition();}catch(_){}});location.replace("login.html");}}catch(e){}</script>
  <header class="topbar">
    <span class="logo">vibely</span>
    <button type="button" class="nav-toggle" id="navToggle" aria-haspopup="true" aria-expanded="false" aria-controls="topbarNav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="topbarNav">
      <a href="dashboard.html">Home</a>
      <a href="events.html">Events</a>
      <a href="groups.html" class="active">Groups</a>
      <a href="music.html">Music</a>
      <a href="lostfound.html">Lost &amp; Found</a>
      <a href="rides.html">Rides</a>
      <a href="profile.html">Profile</a>
    </nav>
    <a href="messages.html" class="notif-btn" id="msgLink" aria-label="Messages">
      <span aria-hidden="true">&#9993;</span><span id="msgBadge" class="notif-badge" hidden>0</span>
    </a>
    <a href="notifications.html" class="notif-btn" id="notifLink" aria-label="Notifications">
      <span aria-hidden="true">&#128276;</span><span id="notifBadge" class="notif-badge" hidden>0</span>
    </a>
    <button id="logout" class="link">Log out</button>
  </header>

  <div class="search-bar">
    <div class="search-wrap">
      <input type="search" id="globalSearch" placeholder="Search Vibely" aria-label="Search people, events, groups, lost and found, rides" autocomplete="off">
      <div class="search-results" id="searchResults" hidden></div>
    </div>
  </div>

  <main class="home">
    <h2>Groups</h2>
    <p class="sub">Campus clubs and interest groups &mdash; request to join one, or start your own.</p>

    <div class="seg" id="groupTabs" role="tablist" aria-label="Groups">
      <button type="button" class="seg-btn active" role="tab" data-tab="all" aria-selected="true">All groups <span class="seg-count" id="allCount"></span></button>
      <button type="button" class="seg-btn" role="tab" data-tab="joined" aria-selected="false">Joined groups <span class="seg-count" id="joinedCount"></span></button>
      <button type="button" class="seg-btn" role="tab" data-tab="mine" aria-selected="false">My groups <span class="seg-count" id="mineCount"></span></button>
    </div>

    <section id="allSection" aria-label="All groups">
      <div id="groupList" class="group-grid"><p class="sub">Loading&hellip;</p></div>
    </section>
    <section id="joinedSection" aria-label="Joined groups" hidden>
      <div id="joinedList" class="group-grid"></div>
    </section>
    <section id="mineSection" aria-label="My groups" hidden>
      <div id="mineList" class="group-grid"></div>
    </section>
  </main>

  <button type="button" class="fab" id="openGroupForm" aria-haspopup="dialog" aria-controls="groupModal" aria-label="Start a group">+</button>

  <div class="modal-overlay" id="groupModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
      <button type="button" class="modal-close" aria-label="Close">&times;</button>
      <section class="card form-card">
        <h3 id="groupModalTitle">Start a group</h3>
        <form id="groupForm" novalidate autocomplete="off">
          <label for="grName">Group name</label>
          <input id="grName" type="text" maxlength="60" placeholder="e.g. Photography Club" required>

          <label for="grCategory">Category</label>
          <select id="grCategory">
            <option value="">General</option>
            <option>Sports</option>
            <option>Cultural</option>
            <option>Academic</option>
            <option>Hobby</option>
          </select>

          <label for="grDescription">Description</label>
          <textarea id="grDescription" rows="3" maxlength="300" placeholder="What's this group about? (optional)"></textarea>
          <button type="submit" class="btn">Create group</button>
        </form>
      </section>
    </div>
  </div>

  <div class="modal-overlay" id="joinModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="joinTitle">
      <button type="button" class="modal-close" aria-label="Close">&times;</button>
      <section class="card form-card">
        <h3 id="joinTitle"></h3>
        <p><span class="badge" id="joinCategory"></span></p>
        <p class="event-desc" id="joinDesc"></p>
        <p class="event-meta" id="joinMeta"></p>
        <p class="sub" id="joinNote"></p>
        <button type="button" class="btn" id="joinRequestBtn">Request to join</button>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
